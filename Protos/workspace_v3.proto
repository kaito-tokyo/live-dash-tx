syntax = "proto3";

package ldtx.workspace.v3;

import "program.proto";
import "persistence.proto";

message Workspace {
  reserved 1, 4, 8;
  reserved "id", "program_preferences";
  string name = 2;
  repeated ProgramRecord programs = 3;
  repeated InputDeviceRecord input_devices = 5;
  repeated ldtx.program.v1.ProgramAudioChannel audio_channels = 6;
  repeated VisionRecord visions = 7;
  repeated VideoComponentRecord video_components = 9;
  WorkspaceOutputConfiguration output_configuration = 10;
  uint32 format_version = 11;
  // Groups backup generations. Copies may intentionally retain this value;
  // it is not a unique identifier for an open document or runtime session.
  string lineage_id = 12;
}

message WorkspaceOutputConfiguration {
  string landscape_profile_id = 1;
  string portrait_profile_id = 2;
  uint32 frame_rate = 3;
  optional string video_pts_master_input_device_id = 4;
  uint32 landscape_video_bit_rate = 5;
  uint32 portrait_video_bit_rate = 6;
}

message VideoComponentRecord {
  string name = 1;
  reserved 2, 3, 4;
  reserved "input_device_id", "source_crop", "removes_background";
  ldtx.program.v1.ProgramComponent component = 5;
}

message WorkspacePreferences {
  reserved 1;
  reserved "program_preferences";
  map<string, string> physical_device_ids_by_input_device_id = 2;
  map<string, string> input_camera_device_mappings = 3;
  map<string, string> input_audio_device_mappings = 4;
  repeated string input_audio_monitor_channel_keys = 5;
  optional string selected_program_name = 6;
  reserved 7, 8;
  reserved "output", "program";
  OutputDestination output_destination = 9;
  ldtx.program.persistence.v1.ProgramPreferences landscape_program = 10;
  ldtx.program.persistence.v1.ProgramPreferences portrait_program = 11;
  map<string, bool> syncs_landscape_mix_to_portrait_by_program_name = 12;
  uint32 format_version = 13;
}

// Workspace-owned destinations. This intentionally excludes remote broadcast
// metadata, which is session state owned by the output coordinator.
message OutputDestination {
  reserved 1;
  reserved "records_locally";
  bool streams_to_youtube = 2;
  bool overrides_output_folder = 3;
  optional string output_folder_path = 4;
  map<string, string> recording_custom_fields = 5;
  bool records_landscape = 6;
  bool records_portrait = 7;
  // Zero preserves the existing DASH behavior for older Workspace packages.
  uint32 youtube_ingest_mode = 8;
}

message VisionRecord {
  string name = 1;
  oneof source {
    bool landscape_program_output = 2;
    string input_device_name = 3;
    bool portrait_program_output = 9;
  }
  // Percentage removed from each edge before analysis.
  ldtx.program.v1.SourceCrop source_crop = 4;
  // Zero means manual updates.
  double update_interval_seconds = 5;
  reserved 6;
  VisionOCRDefinition optical_character_recognition = 7;
  optional VisionHistogramGate histogram_gate = 8;
}

message VisionHistogramGate {
  enum Channel {
    CHANNEL_UNSPECIFIED = 0;
    CHANNEL_HUE = 1;
    CHANNEL_SATURATION = 2;
    CHANNEL_VALUE = 3;
  }

  Channel channel = 1;
  optional uint32 bin_count = 2;
  optional uint32 expected_peak_bin = 3;
  optional double minimum_peak_ratio = 4;
  VisionHistogramRegion region = 5;
}

message VisionHistogramRegion {
  // Normalized coordinates within the Source Crop and resize result.
  double x = 1;
  double y = 2;
  double width = 3;
  double height = 4;
}

message VisionOCRDefinition {
  enum RecognitionLevel {
    RECOGNITION_LEVEL_UNSPECIFIED = 0;
    RECOGNITION_LEVEL_FAST = 1;
    RECOGNITION_LEVEL_ACCURATE = 2;
  }

  RecognitionLevel recognition_level = 1;
  // BCP 47 language tags. Empty enables automatic language detection.
  repeated string recognition_languages = 2;
  // Unset defaults to true in the Workspace domain model.
  optional bool uses_language_correction = 3;
  // Integer pixel subsampling applied independently to width and height.
  // Supported values are 1, 2, and 4; unset defaults to 2.
  uint32 subsampling_rate = 4;
}

message ProgramRecord {
  string name = 1;
  ProgramCanvas landscape = 2;
  ProgramCanvas portrait = 3;
}

message ProgramCanvas {
  string profile_id = 1;
  ldtx.program.v1.Program program = 2;
}

message InputDeviceRecord {
  string name = 1;
  InputDeviceKind kind = 2;
  reserved 3, 4, 5;
  reserved "side_track_recording_policy", "id", "physical_device_id";
  BackgroundRemovalPolicy background_removal_policy = 6;
  ColorRangePolicy color_range_policy = 7;
  uint32 capture_width_override = 8;
  uint32 capture_height_override = 9;
  uint32 capture_frame_rate_override = 10;
}

enum InputDeviceKind {
  INPUT_DEVICE_KIND_UNSPECIFIED = 0;
  INPUT_DEVICE_KIND_VIDEO = 1;
  INPUT_DEVICE_KIND_AUDIO = 2;
}

enum BackgroundRemovalPolicy {
  BACKGROUND_REMOVAL_POLICY_UNSPECIFIED = 0;
  BACKGROUND_REMOVAL_POLICY_ENABLED = 1;
  BACKGROUND_REMOVAL_POLICY_DISABLED = 2;
}

enum ColorRangePolicy {
  COLOR_RANGE_POLICY_UNSPECIFIED = 0;
  COLOR_RANGE_POLICY_VIDEO_RANGE = 1;
  COLOR_RANGE_POLICY_FULL_RANGE = 2;
}

syntax = "proto3";

package ldtx.program.v1;

message Program {
  repeated ProgramComponent components = 1;
  repeated ProgramAudioChannel audio_channels = 2;
  reserved 3, 4;
  reserved "program_video_pts_input_key", "program_audio_pts_input_key";
}

message ProgramComponent {
  string name = 1;
  reserved 2;
  reserved "id";

  oneof definition {
    FillSolidColorComponent solid_color_fill = 10;
    FillLinearGradientComponent linear_gradient_fill = 11;
    FillRadialGradientComponent radial_gradient_fill = 12;
    FillConicGradientComponent conic_gradient_fill = 13;
    InputDeviceComponent input_device = 14;
    ClockComponent clock = 15;
    TestPatternComponent test_pattern = 16;
  }
}

message FillSolidColorComponent {
  Color color = 1;
  Clip clip = 2;
}

message FillLinearGradientComponent {
  Point start = 1;
  Point end = 2;
  Color start_color = 3;
  Color end_color = 4;
  Clip clip = 5;
}

message FillRadialGradientComponent {
  Point center = 1;
  float inner_radius = 2;
  float outer_radius = 3;
  Color inner_color = 4;
  Color outer_color = 5;
  Clip clip = 6;
}

message FillConicGradientComponent {
  Point center = 1;
  float start_angle_radians = 2;
  Color start_color = 3;
  Color end_color = 4;
  Clip clip = 5;
}

message InputDeviceComponent {
  reserved 3;
  reserved "removes_background";

  SourceCrop source_crop = 1;
  Destination destination = 2;
  string input_device_id = 4;
  bool background_removal_enabled = 5;
}

message TestPatternComponent {}

message ClockComponent {
  // Legacy placement. New writers store placement in ProgramPreferences.video_layers.
  DestinationRect destination = 1;
  optional bool shows_seconds = 2;
  optional bool uses_24_hour_time = 3;
  Color foreground_color = 4;
  Color background_color = 5;
  optional bool shows_date = 6;
  optional bool uses_system_time_zone = 7;
  sint32 utc_offset_minutes = 8;
  string background = 9;
  repeated ClockTextOutline outlines = 10;
}

message ClockTextOutline {
  float thickness = 1;
  string color = 2;
}

message ProgramAudioChannel {
  string name = 1;
  reserved 2;
  reserved "id";

  oneof definition {
    InputAudioDeviceComponent input_audio_device = 10;
    SilentAudioComponent silent_audio = 11;
    TestPatternAudioComponent test_pattern_audio = 12;
  }
}

message InputAudioDeviceComponent {
  string input_device_id = 1;
}
message SilentAudioComponent {}
message TestPatternAudioComponent {}

message SourceCrop {
  float top = 1;
  float right = 2;
  float bottom = 3;
  float left = 4;
}

message Destination {
  float x = 1;
  float y = 2;
  // Legacy uniform scale. Readers use this when scale_x/scale_y are absent.
  float scale = 3;
  optional float scale_x = 4;
  optional float scale_y = 5;
}

message DestinationRect {
  float x = 1;
  float y = 2;
  float width = 3;
  float height = 4;
}

message Clip {
  float top = 1;
  float right = 2;
  float bottom = 3;
  float left = 4;
}

message Point {
  float x = 1;
  float y = 2;
}

message Color {
  float red = 1;
  float green = 2;
  float blue = 3;
  float alpha = 4;
}
